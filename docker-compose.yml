services:
  # 1. MySQL database
  mysql:
    image: mysql:8.0
    container_name: app-mysql
    restart: always
    ports:
      - '3307:3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-interview_agent}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          'localhost',
          '-uroot',
          '-p${DB_PASSWORD:-root}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # 2. Redis cache
  redis:
    image: redis:7-alpine
    container_name: app-redis
    restart: always
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-root}
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-root}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data
    networks:
      - app-network

  # 3. etcd (Milvus dependency)
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: milvus-etcd
    restart: always
    volumes:
      - etcd-data:/etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: 1000
      ETCD_QUOTA_BACKEND_BYTES: 4294967296
      ETCD_SNAPSHOT_COUNT: 50000
      ETCD_NAME: etcd-milvus
      ETCD_DATA_DIR: /etcd
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd:2380
      ETCD_INITIAL_CLUSTER: etcd-milvus=http://etcd:2380
      ETCD_INITIAL_CLUSTER_TOKEN: milvus-etcd
      ETCD_INITIAL_CLUSTER_STATE: new
    command: etcd
    healthcheck:
      test: ['CMD', 'etcdctl', 'endpoint', 'health']
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - app-network

  # 4. MinIO object storage (Milvus dependency)
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: milvus-minio
    restart: always
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/minio_data
    command: server /minio_data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_REGION_NAME: us-east-1
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - app-network

  # 5. Milvus standalone
  milvus:
    image: milvusdb/milvus:v2.4.23
    container_name: milvus-standalone
    restart: always
    ports:
      - '19530:19530'
      - '9091:9091'
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BUCKET_NAME: milvus-bucket
      MINIO_USE_SSL: 'false'
    command: ['milvus', 'run', 'standalone']
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9091/healthz']
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    networks:
      - app-network

  # 12. Backend API service
  backend:
    env_file:
      - .env
    build:
      context: backend
      dockerfile: Dockerfile
      cache_from:
        - type=local,src=/tmp/.buildx-cache/backend
    ports:
      - '8899:8899'
    container_name: app-backend
    restart: always
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: ${DB_NAME:-interview_agent}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-root}
      MILVUS_ADDRESS: milvus:19530
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    volumes:
      - ./backend/config.yaml:/app/config.yaml
      - ./backend/logs:/app/logs
    networks:
      - app-network

  # 14. Frontend app
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
      cache_from:
        - type=local,src=/tmp/.buildx-cache/frontend
    ports:
      - '3000:3000'
    container_name: app-frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api
    depends_on:
      - backend
    networks:
      - app-network

  # 13. Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: app-nginx
    restart: always
    ports:
      - '81:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend
    networks:
      - app-network

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  etcd-data:
    driver: local
  minio-data:
    driver: local
  milvus-data:
    driver: local
  go-mod-cache:
  node-mod-cache:

networks:
  app-network:
    driver: bridge
