name: rag-platform

services:
  rag-server:
    env_file:
      - .env
    build:
      context: ./backend
      dockerfile: Dockerfile.rag
    restart: unless-stopped
    # ports:
    #   - "8899:8899"  # 容器内部网络访问即可，无需暴露到宿主机
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: ${DB_NAME:-interview_agent}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-root}
      MILVUS_ADDRESS: milvus:19530
      MILVUS_USERNAME: ${MILVUS_USERNAME:-}
      MILVUS_PASSWORD: ${MILVUS_PASSWORD:-}
      DOCUMENT_PARSER_PROVIDER: ${DOCUMENT_PARSER_PROVIDER:-http}
      DOCUMENT_PARSER_ENGINE: ${DOCUMENT_PARSER_ENGINE:-docling}
      DOCUMENT_PARSER_ENDPOINT: ${DOCUMENT_PARSER_ENDPOINT:-http://parser-provider:9000/parse}
      DOCUMENT_PARSER_TIMEOUT_MS: ${DOCUMENT_PARSER_TIMEOUT_MS:-60000}
      DOCUMENT_PARSER_STRICT_MODE: ${DOCUMENT_PARSER_STRICT_MODE:-true}
      DOCUMENT_PARSER_SAVE_SIDECAR: ${DOCUMENT_PARSER_SAVE_SIDECAR:-true}
      OCR_PROVIDER: ${OCR_PROVIDER:-http}
      OCR_ENDPOINT: ${OCR_ENDPOINT:-}
      OCR_TIMEOUT_MS: ${OCR_TIMEOUT_MS:-30000}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    volumes:
      - ./backend/config.yaml:/app/config.yaml:ro
      - ./backend/logs:/app/logs
    networks:
      - rag-network

  docling-serve:
    profiles: ["parser"]
    image: ${DOCLING_SERVE_IMAGE:-quay.io/docling-project/docling-serve-cpu:latest}
    restart: unless-stopped
    # ports:
    #   - "${DOCLING_SERVE_PORT:-5001}:5001"  # 容器内部网络访问即可，无需暴露到宿主机
    environment:
      DOCLING_SERVE_ENABLE_UI: ${DOCLING_SERVE_ENABLE_UI:-1}
    networks:
      - rag-network

  parser-provider:
    profiles: ["parser"]
    build:
      context: ./backend
      dockerfile: Dockerfile.parser-provider
    restart: unless-stopped
    # ports:
    #   - "${PARSER_PROVIDER_PORT:-9000}:9000"  # 容器内部网络访问即可，无需暴露到宿主机
    environment:
      PARSER_PROVIDER_HOST: 0.0.0.0
      PARSER_PROVIDER_PORT: 9000
      DOCLING_BASE_URL: http://docling-serve:5001
      DOCLING_CONVERT_PATH: /v1/convert/file
      DOCLING_TIMEOUT_MS: ${DOCLING_TIMEOUT_MS:-120000}
    depends_on:
      - docling-serve
    networks:
      - rag-network

  rag-mcp-server:
    env_file:
      - .env
    build:
      context: ./backend
      dockerfile: Dockerfile.mcp
    restart: unless-stopped
    ports:
      - "${MCP_PORT:-8898}:${MCP_PORT:-8898}"
    environment:
      MCP_ENABLED: ${MCP_ENABLED:-true}
      MCP_TRANSPORT: ${MCP_TRANSPORT:-http}
      MCP_HOST: ${MCP_HOST:-0.0.0.0}
      MCP_PORT: ${MCP_PORT:-8898}
      MCP_ENDPOINT: ${MCP_ENDPOINT:-/mcp}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      MCP_UPSTREAM_TIMEOUT_MS: ${MCP_UPSTREAM_TIMEOUT_MS:-5000}
      MCP_ENABLE_LEGACY_APP_ID: ${MCP_ENABLE_LEGACY_APP_ID:-false}
      RAG_BASE_URL: ${RAG_BASE_URL:-http://rag-server:8899}
      # Keep a local-debug fallback so stdio-based binaries can still boot when needed.
      RAG_ACCESS_TOKEN: ${RAG_ACCESS_TOKEN:-rag_local_debug_token}
    depends_on:
      rag-server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ \"$${MCP_TRANSPORT:-http}\" = \"http\" ]; then curl -fsS \"http://127.0.0.1:$${MCP_PORT:-8898}/healthz\" >/dev/null; else pgrep -f rag-mcp-server >/dev/null; fi",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - rag-network

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    # ports:
    #   - "3308:3306"  # 仅本地开发时需要暴露，容器间通过内部网络访问
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-interview_agent}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - rag-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-root}
    # ports:
    #   - "6380:6379"  # 仅本地开发时需要暴露，容器间通过内部网络访问
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-root}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - rag-network

  milvus:
    image: milvusdb/milvus:v2.4.23
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "true"
      COMMON_STORAGETYPE: local
    # ports:
    #   - "19531:19530"  # 仅本地开发时需要暴露，容器间通过内部网络访问
    #   - "9092:9091"    # 健康检查在容器内完成，无需暴露到宿主机
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - rag-network

  attu:
    image: zilliz/attu:v2.4.12
    restart: unless-stopped
    ports:
      - "8001:3000"  # Milvus 管理UI，非应用必须；需要时取消注释即可访问
    environment:
      MILVUS_URL: milvus:19530
    depends_on:
      milvus:
        condition: service_healthy
    networks:
      - rag-network

  rag-admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
        API_PROXY_TARGET: http://rag-server:8899
    restart: unless-stopped
    ports:
      - "3003:3001"    # 用户浏览器访问入口，必须保留
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api
      API_PROXY_TARGET: http://rag-server:8899
    depends_on:
      rag-server:
        condition: service_healthy
    networks:
      - rag-network

volumes:
  mysql-data:
  redis-data:
  milvus-data:

networks:
  rag-network:
    driver: bridge
