# RAG Platform standalone config
# This file is used by cmd/rag-server in Docker and local runs.

host: "0.0.0.0"
port: 8899

database:
  driver: "mysql"
  dsn: "${DB_USER}:${DB_PASSWORD}@tcp(${DB_HOST}:${DB_PORT})/${DB_NAME}?charset=utf8mb4&parseTime=True&loc=Local"
  max_open_conns: 100
  max_idle_conns: 10
  conn_max_lifetime: "1h"

redis:
  addr: "${REDIS_HOST}:${REDIS_PORT}"
  password: "${REDIS_PASSWORD}"
  db: 0
  dial_timeout: "5s"
  read_timeout: "3s"
  write_timeout: "3s"
  pool_size: 10
  min_idle_conns: 5

security:
  # Keep these for token parsing / future admin auth integration.
  jwt_secret: "your-rag-jwt-secret-key"
  jwt_expiration: "24h"

rag:
  enabled: true
  environment: dev
  auth:
    dev_admin_bypass_enabled: true  # 仅 dev 环境可用
    jwt_secret: "your-jwt-secret-key-here"
    access_token_ttl: "2h"
    refresh_token_ttl: "168h"
    bootstrap_enabled: true
    bootstrap_admin_email: "admin@example.com"
    bootstrap_admin_password: "Admin@123456"
    bootstrap_admin_name: "Admin"
    bootstrap_tenant_name: "Default"
  feature_flags:
    enable_prod_guard: false
    enable_ingest_retry: false
    enable_retrieve_audit: true
    enable_hybrid_retrieval: true
    enable_query_rewrite: true
    enable_dynamic_topk: true
    enable_advanced_rerank: true
    enable_parent_child_retrieval: true
    enable_strategic_topk: false
    enable_evidence_refusal: false
    enable_citation_consistency: false
    enable_domain_terms: false
    enable_route_specific_rewrite: false
    enable_model_assisted_rewrite: false
    enable_experiment_platform: false
    enable_index_lifecycle: false
    enable_cost_dashboard: false
    enable_compliance_audit: false
    enable_weekly_report: false
    enable_milvus_ops_tooling: false
    enable_collection_switch_guard: false
    enable_cost_governance: false
    enable_audit_center: false
    enable_vector_ops: false
    enable_governance_alerts: false
    enable_semantic_cache: true
  semantic_cache:
    similarity_threshold: 0.92
    ttl_seconds: 900
    max_candidates: 20
    max_entries_per_scope: 200
  thresholds:
    max_retry_count: 3
    retry_backoff_ms: 500
    retrieve_timeout_ms: 3000
    user_qps_limit: 20
  phase2:
    fusion_strategy: minmax_v1
    rrf_k: 60
    rrf_dense_weight: 0.7
    rrf_sparse_weight: 0.3
    hybrid_dense_weight: 0.7
    hybrid_sparse_weight: 0.3
    candidate_topk: 10
    min_topk: 3
    max_topk: 8
    token_budget: 0
    min_answer_chunks: 2
    rewrite_timeout_ms: 120
    rewrite_max_expansions: 3
    rerank_timeout_ms: 250
    rerank_model: "jaccard-v1"
  phase3:
    parent_child_fill_strategy: section_window
    parent_child_window_size: 1
    parent_child_max_tokens: 1200
    strategic_topk_min_k: 2
    strategic_topk_max_k: 8
    strategic_topk_budget_ratio: 0.6
    evidence_min_rerank_score: 0.55
    evidence_min_density: 0.2
    evidence_min_citation_coverage: 0.5
    citation_check_threshold: 0.7
    citation_check_version: "phase3-citation-v1"
    domain_term_timeout_ms: 80
    model_rewrite_timeout_ms: 150
    model_rewrite_shadow_ratio: 0.1
  release:
    enabled: false
    stage: full
    internal_roles: ["admin"]
    canary_percent: 5
    batch_percent: 25
    user_allowlist: []

Embedding:
  APIKey: "${EMBEDDING_API_KEY}"
  Provider: "${EMBEDDING_PROVIDER}"
  Model: "${EMBEDDING_MODEL}"
  BaseURL: "${EMBEDDING_BASE_URL}"
  Region: "${EMBEDDING_REGION}"
  Timeout: 30s
  RetryTimes: 3
  Dimensions: 2048
  BatchSize: 10
  User: ""
  EnableCache: true
  CacheTTLSeconds: 1800
  CacheMaxEntries: 2000

Milvus:
  Address: "${MILVUS_ADDRESS}"
  Username: "${MILVUS_USERNAME}"
  Password: "${MILVUS_PASSWORD}"
  DatabaseName: "default"
  CollectionName: "documents"
  Collections:
    knowledge: "documents"
  TopK: 5
  MetricType: "COSINE"
  ConnectTimeout: 10s
  SearchTimeout: 30s

DocumentSplitter:
  ChunkSize: 1000
  OverlapSize: 200
  Separators:
    - "\n\n"
    - "\n"
    - "\u3002"
    - "\uFF01"
    - "\uFF1F"
    - ". "
    - "! "
    - "? "
  KeepType: 0
