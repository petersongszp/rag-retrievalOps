# 服务配置
host: '0.0.0.0'
port: 8899

# 数据库配置
database:
  driver: 'mysql'
  dsn: '${DB_USER}:${DB_PASSWORD}@tcp(${DB_HOST}:${DB_PORT})/${DB_NAME}?charset=utf8mb4&parseTime=True&loc=Local'
  max_open_conns: 100
  max_idle_conns: 10
  conn_max_lifetime: '1h'

# Redis配置
redis:
  addr: '${REDIS_HOST}:${REDIS_PORT}'
  password: '${REDIS_PASSWORD}'
  db: 0
  dial_timeout: '5s'
  read_timeout: '3s'
  write_timeout: '3s'
  pool_size: 10
  min_idle_conns: 5

# Hertz框架配置（11.1 高并发：连接池、协程模型、限流）
hertz:
  log_level: 'info'
  log_path: './logs'
  read_timeout: '10s'
  write_timeout: '10s'
  idle_timeout: '60s'
  keep_alive: true # 11.1.1 连接池：KeepAlive
  gomaxprocs: 0 # 11.1.2 协程模型：P 数量，0=不设置
  rate_limit: # 11.1.3 限流
    rps: 20
    burst: 50
    use_redis: false # 多实例部署时改为 true 启用分布式限流
    redis_key_prefix: 'rl:'

# Eino / 推理成本控制（11.2.3）
eino:
  token_quota_per_user_per_day: 0 # 每用户每日 Token 上限，0 表示不限制；启用可设如 100000

# 面试系统配置
interview:
  max_duration: '30m'
  question_timeout: '10m'
  max_questions: 10
  min_questions: 5

# 安全性配置
security:
  jwt_secret: 'your-jwt-secret-key-here'
  jwt_expiration: '24h'
  cors:
    allow_origins: ['*']
    allow_methods: ['GET', 'POST', 'PUT', 'DELETE', 'OPTIONS']
    allow_headers: ['Origin', 'Content-Type', 'Authorization']
    expose_headers: []
    allow_credentials: true

# Google搜索工具配置
google_search:
  api_key: 'your-google-api-key-here'
  search_engine_id: 'your-search-engine-id-here'

# OpenAI配置（已弃用，保留兼容）
openai:
  api_key: '${LLM_API_KEY}'
  model_name: '${LLM_MODEL_NAME}'
  base_url: '${LLM_BASE_URL}'

# LLM 大模型配置（所有面试智能体统一使用）
llm:
  api_key: '${LLM_API_KEY}'
  base_url: '${LLM_BASE_URL}'
  model_name: '${LLM_MODEL_NAME}'
  provider_name: '${LLM_PROVIDER_NAME}'

# Embedding 服务配置
Embedding:
  # 认证配置（APIKey 或 AccessKey/SecretKey 二选一）
  # 支持环境变量引用语法：${VAR_NAME} 或 $VAR_NAME
  APIKey: '${EMBEDDING_API_KEY}' # 从环境变量 EMBEDDING_API_KEY 读取
  # AccessKey: "${EMBEDDING_ACCESS_KEY}"   # 从环境变量 EMBEDDING_ACCESS_KEY 读取
  # SecretKey: "${EMBEDDING_SECRET_KEY}"   # 从环境变量 EMBEDDING_SECRET_KEY 读取

  # 服务配置
  Model: '${EMBEDDING_MODEL}' # Ark 平台的端点 ID，从环境变量读取
  BaseURL: '${EMBEDDING_BASE_URL}' # API 基础 URL，从环境变量读取
  Region: '${EMBEDDING_REGION}' # 服务区域，从环境变量读取

  # 高级配置
  Timeout: 30s # 请求超时时间
  RetryTimes: 3 # 重试次数
  Dimensions: 2560 # 输出向量维度（修改为实际模型输出维度）
  User: '' # 用户标识（可选）

# Milvus 向量数据库配置
Milvus:
  # 连接配置
  Address: '${MILVUS_ADDRESS}' # Milvus 服务地址，从环境变量读取（.env 中设置）
  Username: '${MILVUS_USERNAME}' # 从环境变量 MILVUS_USERNAME 读取
  Password: '${MILVUS_PASSWORD}' # 从环境变量 MILVUS_PASSWORD 读取
  DatabaseName: 'default' # 数据库名称
  CollectionName: 'documents' # 默认集合名称

  # 多集合配置（可选）- 支持配置多个命名集合
  Collections:
    feishu: 'feishu_docs_20251126' # 飞书文档集合
    interview: 'interview_questions' # 面试题库集合
    knowledge: 'knowledge_base' # 知识库集合

  # 检索配置
  TopK: 5 # 返回的最相似文档数量
  MetricType: 'COSINE' # 距离度量类型: L2, IP, COSINE

  # 超时配置
  ConnectTimeout: 10s # 连接超时
  SearchTimeout: 30s # 搜索超时

# 文档分割器配置
DocumentSplitter:
  ChunkSize: 1000 # 目标片段大小（字符数）
  OverlapSize: 200 # 片段重叠大小（字符数）
  Separators: # 分隔符列表（按优先级排序）
    - "\n\n" # 双换行（段落）
    - "\n" # 单换行
    - '。' # 中文句号
    - '！' # 中文感叹号
    - '？' # 中文问号
    - '. ' # 英文句号
    - '! ' # 英文感叹号
    - '? ' # 英文问号
  KeepType: 0 # 分隔符保留策略: 0=不保留, 1=保留在开头, 2=保留在结尾

# 微信配置
wechat:
  app_id: appid
  app_secret: appsecret
  redirect_url: 'http://localhost:8899/api/v1/user/wechat/callback'

# GitHub OAuth（redirect_url 需与 GitHub 应用里填写的 Authorization callback URL 一致，如前端回调页）
github:
  client_id: '${GITHUB_CLIENT_ID}'
  client_secret: '${GITHUB_CLIENT_SECRET}'
  redirect_url: '${GITHUB_REDIRECT_URL}'

# Google OAuth（邮箱登录，redirect_url 需与 Google 控制台里授权的重定向 URI 一致）
google_oauth:
  client_id: '${GOOGLE_CLIENT_ID}'
  client_secret: '${GOOGLE_CLIENT_SECRET}'
  redirect_url: '${GOOGLE_REDIRECT_URL}'

# 飞书配置
feishu:
  enabled: false # 是否启用飞书告警
  webhook_url: '${FEISHU_WEBHOOK_URL}' # 飞书机器人 Webhook URL，从环境变量读取

# 支付配置
payment:
  stripe:
    secret_key: '${STRIPE_SECRET_KEY}' # Stripe Secret Key，从环境变量读取
    webhook_secret: '${STRIPE_WEBHOOK_SECRET}' # Stripe Webhook 签名密钥
    publishable_key: '${STRIPE_PUBLISHABLE_KEY}' # Stripe Publishable Key（前端使用）
  paypal:
    client_id: 'AX8uqQ0BYNwm3dB4M-QxqveVQNLpgzQ87UXjrbp15UwtBcD3cyRvkk8J28AlbgDmNZ4wHRSiST8bojdj' # PayPal Client ID
    client_secret: 'ENt-TR83tPzKCb5LrJsyw382nVGVO5En4ni5RUZ0WfWF52QkII_esdpcPJjJbZtLEhuJlCqTsQ6XothL' # PayPal Client Secret
    webhook_id: '3YE693123Р282731M' # PayPal Webhook ID（用于验签）
    sandbox: true # true=沙箱环境, false=生产环境
  webhook_timeout: '5m' # Webhook 事件时间窗口（防重放）
  allowed_return_urls: # 支付成功/取消跳转 URL 白名单
    - 'http://localhost:3000'
    - 'http://localhost:3000'

# LLM API 限流配置
rate_limit:
  enabled: true
  default_rpm: 0 # 每分钟最大请求数（默认不限制）
  default_tpm: 0 # 每分钟最大 Token 数（默认不限制）
  models: # 按模型自定义限制（可选）
    'deepseek-ai/DeepSeek-V3.2':
      rpm: 500
      tpm: 1000000
    # "deepseek-chat":
    #   rpm: 100
    #   tpm: 500000

#SMTP配置
email:
  smtp_host: '${SMTP_HOST}'
  smtp_port: ${SMTP_PORT}
  smtp_user: '${SMTP_USER}'
  smtp_pass: '${SMTP_PASS}'
  from_email: '${SMTP_FROM}'

