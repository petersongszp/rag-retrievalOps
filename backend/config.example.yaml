# 服务配置
host: "0.0.0.0"
port: 8000

# 数据库配置
database:
  driver: "mysql"
  dsn: "root:root@tcp(localhost:3306)/interview_agent?charset=utf8mb4&parseTime=True&loc=Local"
  max_open_conns: 100
  max_idle_conns: 10
  conn_max_lifetime: "1h"

# Redis配置
redis:
  addr: "localhost:6379"
  password: ""
  db: 0
  dial_timeout: "5s"
  read_timeout: "3s"
  write_timeout: "3s"
  pool_size: 10
  min_idle_conns: 5

# Hertz框架配置（11.1 高并发：连接池、协程模型、限流）
hertz:
  log_level: "info"
  log_path: "./logs"
  read_timeout: "10s"
  write_timeout: "10s"
  idle_timeout: "60s"
  keep_alive: true                    # 11.1.1 连接池：KeepAlive
  gomaxprocs: 0                       # 11.1.2 协程模型：P 数量，0=不设置
  rate_limit:                         # 11.1.3 限流
    rps: 20
    burst: 50
    use_redis: false                  # 多实例部署时改为 true 启用分布式限流
    redis_key_prefix: "rl:"

# 面试系统配置
interview:
  max_duration: "30m"
  question_timeout: "10m"
  max_questions: 10
  min_questions: 5

# 安全性配置
security:
  jwt_secret: "your-jwt-secret-key-here"
  jwt_expiration: "24h"
  cors:
    allow_origins: ["*"]
    allow_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    allow_headers: ["Origin", "Content-Type", "Authorization"]
    expose_headers: []
    allow_credentials: true

# Google搜索工具配置
google_search:
  api_key: "your-google-api-key-here"
  search_engine_id: "your-search-engine-id-here"

# OpenAI配置
openai:
  api_key: "your-openai-api-key-here"
  model_name: "your-model-name"
  base_url: "https://api.openai.com/v1"

# Embedding 服务配置
Embedding:
  # 认证配置（APIKey 或 AccessKey/SecretKey 二选一）
  # 支持环境变量引用语法：${VAR_NAME} 或 $VAR_NAME
  APIKey: "${EMBEDDING_API_KEY}"           # 从环境变量 EMBEDDING_API_KEY 读取
  # AccessKey: "${EMBEDDING_ACCESS_KEY}"   # 从环境变量 EMBEDDING_ACCESS_KEY 读取
  # SecretKey: "${EMBEDDING_SECRET_KEY}"   # 从环境变量 EMBEDDING_SECRET_KEY 读取

  # 服务配置
  Model: "${EMBEDDING_MODEL}"              # Ark 平台的端点 ID，从环境变量读取
  BaseURL: "${EMBEDDING_BASE_URL}"         # API 基础 URL，从环境变量读取
  Region: "${EMBEDDING_REGION}"            # 服务区域，从环境变量读取

  # 高级配置
  Timeout: 30s      # 请求超时时间
  RetryTimes: 3     # 重试次数
  Dimensions: 2560  # 输出向量维度（修改为实际模型输出维度）
  User: ""          # 用户标识（可选）

# Milvus 向量数据库配置
Milvus:
  # 连接配置
  Address: "${MILVUS_ADDRESS}"              # Milvus 服务地址，从环境变量读取（.env 中设置）
  Username: "${MILVUS_USERNAME}"            # 从环境变量 MILVUS_USERNAME 读取
  Password: "${MILVUS_PASSWORD}"            # 从环境变量 MILVUS_PASSWORD 读取
  DatabaseName: "default"                   # 数据库名称
  CollectionName: "documents"               # 默认集合名称

  # 多集合配置（可选）- 支持配置多个命名集合
  Collections:
    feishu: "feishu_docs_20251126"           # 飞书文档集合
    interview: "interview_questions"         # 面试题库集合
    knowledge: "knowledge_base"              # 知识库集合

  # 检索配置
  TopK: 5                                   # 返回的最相似文档数量
  MetricType: "COSINE"                      # 距离度量类型: L2, IP, COSINE

  # 超时配置
  ConnectTimeout: 10s                       # 连接超时
  SearchTimeout: 30s                        # 搜索超时

# 文档分割器配置
DocumentSplitter:
  ChunkSize: 1000                      # 目标片段大小（字符数）
  OverlapSize: 200                     # 片段重叠大小（字符数）
  Separators:                          # 分隔符列表（按优先级排序）
    - "\n\n"                           # 双换行（段落）
    - "\n"                             # 单换行
    - "。"                             # 中文句号
    - "！"                             # 中文感叹号
    - "？"                             # 中文问号
    - ". "                             # 英文句号
    - "! "                             # 英文感叹号
    - "? "                             # 英文问号
  KeepType: 0                          # 分隔符保留策略: 0=不保留, 1=保留在开头, 2=保留在结尾

# 微信配置
wechat:
  app_id: appid
  app_secret: appsecret
  redirect_url: "http://localhost:8000/api/v1/user/wechat/callback"

# Google OAuth（邮箱登录）
google_oauth:
  client_id: "${GOOGLE_CLIENT_ID}"
  client_secret: "${GOOGLE_CLIENT_SECRET}"
  redirect_url: "${GOOGLE_REDIRECT_URL}"

# 飞书配置（12.2 告警与通知：系统异常 / 业务风控告警均通过飞书推送）
feishu:
  enabled: false  # 是否启用飞书告警
  webhook_url: "${FEISHU_WEBHOOK_URL}"  # 飞书群机器人 Webhook URL，从环境变量读取