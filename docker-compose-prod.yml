services:
  # 1. MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: app-mysql
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-interview_agent}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # 2. Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: app-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-root}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-root}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data
    networks:
      - app-network

  # 3. Etcd服务（Milvus依赖）
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: milvus-etcd
    restart: always
    volumes:
      - etcd-data:/etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
      - ETCD_NAME=etcd-milvus
      - ETCD_DATA_DIR=/etcd
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd:2380
      - ETCD_INITIAL_CLUSTER=etcd-milvus=http://etcd:2380
      - ETCD_INITIAL_CLUSTER_TOKEN=milvus-etcd
      - ETCD_INITIAL_CLUSTER_STATE=new
    command: etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - app-network

  # 12. 后端 API 服务
  backend:
    build:
      context: backend
      dockerfile: Dockerfile
      cache_from:
        - type=local,src=/tmp/.buildx-cache/backend
#      cache_to:
#        - type=local,dest=/tmp/.buildx-cache/backend,mode=max
    container_name: app-backend
    restart: always
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: ${DB_NAME:-interview_agent}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-root}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/config.yaml:/app/config.yaml
      - ./backend/logs:/app/logs
    networks:
      - app-network

  # 14. 前端应用
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      cache_from:
        - type=local,src=/tmp/.buildx-cache/frontend
#      cache_to:
#        - type=local,dest=/tmp/.buildx-cache/frontend,mode=max
    container_name: app-frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api
    depends_on:
      - backend
    networks:
      - app-network


  # 13. Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: app-nginx
    restart: always
    ports:
      - "81:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend
    networks:
      - app-network

# 数据卷定义
volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  etcd-data:
    driver: local
  minio-data:
    driver: local
  go-mod-cache:
  node-mod-cache:

# 网络定义
networks:
  app-network:
    driver: bridge